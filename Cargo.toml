[package]
name = "ruste_etl"
version = "0.1.0"
edition = "2024"

[dependencies]

utoipa = "4.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
csv = "1.3"
calamine = "0.19"
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1.34", features = ["rt-multi-thread", "macros"] }
serde_json = "1.0"
hyper = "1.7"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
rand = "0.8"

[dev-dependencies]
umya-spreadsheet = "0.6"
rand = "0.8"
httpmock = "0.6"

[features]
server = []
